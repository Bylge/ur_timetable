name: Update timetables

# Three checks a day: read the university's timetable page, download only PDFs that changed (conditional
# requests), parse, validate, publish to data/published/, commit, deploy the site.
# Cron is UTC and GitHub can start it up to ~30-60 min late. Polish time:
#   04:07 UTC = 5:07 (winter) / 6:07 (summer)   before students check their day
#   11:37 UTC = 12:37 / 13:37                   updates made by the office in the morning
#   17:37 UTC = 18:37 / 19:37                   everything from the working day, before planning tomorrow
# By hand: Actions -> Update timetables -> Run workflow.
on:
  schedule:
    - cron: "7 4 * * *"
    - cron: "37 11 * * *"
    - cron: "37 17 * * *"
  workflow_dispatch:
    inputs:
      approve:
        description: "Publish even a large change (only after checking it)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

      - name: Check the university pages
        id: update
        run: |
          set +e
          python -m ur_timetable update ${{ inputs.approve && '--approve' || '' }} 2>&1 | tee update.log
          code=${PIPESTATUS[0]}
          echo "problem=$([ "$code" -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0

      # Every check is committed (index.json records it), which also keeps GitHub from disabling the schedule.
      - name: Commit the check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Data: check $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      # A timetable that couldn't be published (the site shows the last good version with a red status):
      # one open issue until a later check passes, then it's closed. GitHub emails the repository owner.
      - name: Report a problem or close the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Timetable update: a new version could not be published"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "${{ steps.update.outputs.problem }}" = "true" ]; then
            if [ -z "$open" ]; then
              {
                echo "The check at $(date -u +'%Y-%m-%d %H:%M') UTC didn't publish every timetable."
                echo "The site keeps the last good version and shows a red status with a link to the PDF."
                echo
                echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                echo
                echo '```'
                grep -v '^  ' update.log | tail -n 60
                echo '```'
              } > issue.md
              gh issue create --title "$title" --body-file issue.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "The next check published everything."
          fi

  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
